name: Build AmigosSMP plugin
on:
  push:
    branches: [ main ]
    paths: [ 'plugin/**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: AmigosSMP-plugin
          path: plugin/target/AmigosSMP.jar
